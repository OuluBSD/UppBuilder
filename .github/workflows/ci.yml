name: UppBuilder CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-posix:
    name: Build (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++

    steps:
      - name: Checkout UppBuilder
        uses: actions/checkout@v4

      - name: Checkout UppOverlay Catalog
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppOverlay
          path: UppOverlay

      - name: Compile with bootstrap.sh (${{ matrix.compiler }})
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          chmod +x ./bootstrap.sh
          ./bootstrap.sh

      - name: Verify CLI Output
        run: |
          ./uppbuilder --version
          ./uppbuilder --help

      - name: Test Flag Auditor
        run: |
          ./uppbuilder --audit-flags examples/AuditTestPkg --audit-patch

      - name: Test Portage USE Model & Policy Engine
        run: |
          ./uppbuilder explain-use sqlite
          ./uppbuilder explain-use virtualgui
          ./uppbuilder use examples/AuditTestPkg --use "+sqlite -gtk st"
          ./uppbuilder use examples/PolicyTestPkg
          ./uppbuilder use examples/PolicyTestPkg --use "+sqlite"

      - name: Test Target Profiles & UppOverlay Catalog
        run: |
          ./uppbuilder profile list
          ./uppbuilder profile show NativeClang
          ./uppbuilder virtual list
          ./uppbuilder virtual resolve Virtual/Sqlite
          ./uppbuilder virtual resolve Virtual/Png
          ./uppbuilder overlay list
          ./uppbuilder overlay info DevCpp/BazaarCore
          ./uppbuilder overlay info DevUtil/UppBuilder
          ./uppbuilder overlay info Virtual/Sqlite
          ./uppbuilder --profile NativeClang --use "+debug" --show-use examples/PolicyTestPkg

      - name: Test Emerge / Install Engine
        run: |
          ./uppbuilder emerge DevCpp/Eon -p
          ./uppbuilder emerge AiAgents/SuperIntelligence -p
          ./uppbuilder install MediaSound/SoftAudio --profile NativeClang -p

      - name: Test CMake Build
        run: |
          mkdir -p build && cd build
          cmake ..
          cmake --build . --config Release

  test-windows:
    name: Build (windows-latest - MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout UppBuilder
        uses: actions/checkout@v4

      - name: Checkout UppOverlay Catalog
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppOverlay
          path: UppOverlay

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile with bootstrap.bat
        shell: cmd
        run: |
          call bootstrap.bat

      - name: Verify CLI Output
        shell: cmd
        run: |
          uppbuilder.exe --version
          uppbuilder.exe --help

      - name: Test Flag Auditor
        shell: cmd
        run: |
          uppbuilder.exe --audit-flags examples/AuditTestPkg --audit-patch

      - name: Test Portage USE Model & Policy Engine
        shell: cmd
        run: |
          uppbuilder.exe explain-use sqlite
          uppbuilder.exe explain-use virtualgui
          uppbuilder.exe use examples/AuditTestPkg --use "+sqlite -gtk st"
          uppbuilder.exe use examples/PolicyTestPkg
          uppbuilder.exe use examples/PolicyTestPkg --use "+sqlite"

      - name: Test Target Profiles & UppOverlay Catalog
        shell: cmd
        run: |
          uppbuilder.exe profile list
          uppbuilder.exe profile show MsvcX64
          uppbuilder.exe virtual list
          uppbuilder.exe virtual resolve Virtual/Sqlite
          uppbuilder.exe virtual resolve Virtual/Png
          uppbuilder.exe overlay list
          uppbuilder.exe overlay info DevCpp/BazaarCore
          uppbuilder.exe overlay info DevUtil/UppBuilder
          uppbuilder.exe overlay info Virtual/Sqlite
          uppbuilder.exe --profile MsvcX64 --use "+debug" --show-use examples/PolicyTestPkg

      - name: Test Emerge / Install Engine
        shell: cmd
        run: |
          uppbuilder.exe emerge DevCpp/Eon -p
          uppbuilder.exe emerge AiAgents/SuperIntelligence -p
          uppbuilder.exe install MediaSound/SoftAudio --profile MsvcX64 -p

      - name: Test CMake Build
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build . --config Release
